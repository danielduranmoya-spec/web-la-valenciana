/* Pantalla de carga: va en línea para verse antes de que lleguen las hojas de estilo y los scripts */
.lv-carga{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:#FFFFFF radial-gradient(ellipse at 50% 42%,#F8F3EB 0,#F8F3EB 22%,rgba(248,243,235,0) 62%);
  color:#2F2A26;font-family:"Jost","Helvetica Neue",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;
  transition:opacity .45s ease,visibility 0s linear .45s}
.lv-carga__in{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:22rem;opacity:0;animation:lvc-aparece .5s ease .35s forwards}
.lv-carga__ovillo{width:132px;height:112px;overflow:visible}
.lv-carga__bola{transform-origin:60px 58px;animation:lvc-gira 2.6s ease-in-out infinite}
.lv-carga__hebra{stroke-dasharray:150;stroke-dashoffset:150;animation:lvc-hebra 2.6s ease-in-out infinite}
.lv-carga__aguja{transform-origin:118px 78px;animation:lvc-aguja 2.6s ease-in-out infinite}
.lv-carga__marca{margin:4px 0 0;font:400 1.75rem/1.1 "Playfair Display","Federo","Iowan Old Style",Georgia,serif;letter-spacing:.01em}
.lv-carga__filete{width:56px;height:2px;border-radius:2px;background:linear-gradient(90deg,#C8A27A,#7A4E2D);overflow:hidden;position:relative}
.lv-carga__filete::after{content:"";position:absolute;inset:0;background:#F8F3EB;transform:translateX(-100%);animation:lvc-filete 1.6s ease-in-out infinite}
.lv-carga__txt{margin:0;font-size:1rem;line-height:1.5;color:#5E554D;min-height:3em}
.lv-carga__txt a{color:#7A4E2D;font-weight:600;text-underline-offset:3px}
.lv-carga__lento{display:none}
.lv-carga.es-lenta .lv-carga__normal{display:none}
.lv-carga.es-lenta .lv-carga__lento{display:inline}
html.lv-cargada .lv-carga{opacity:0;visibility:hidden;pointer-events:none}
@keyframes lvc-aparece{to{opacity:1}}
@keyframes lvc-gira{0%{transform:rotate(0)}50%{transform:rotate(-14deg)}100%{transform:rotate(0)}}
@keyframes lvc-hebra{0%{stroke-dashoffset:150}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-150}}
@keyframes lvc-aguja{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-6px) rotate(-6deg)}}
@keyframes lvc-filete{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.lv-carga__bola,.lv-carga__hebra,.lv-carga__aguja,.lv-carga__filete::after{animation:none}.lv-carga__hebra{stroke-dashoffset:0}.lv-carga__in{animation-duration:.01s}}
@media print{.lv-carga{display:none}}
html:not(.js) .lv-carga{display:none}
</style>

<script>
/* Pantalla de carga: se quita cuando la tienda avisa de que está lista (lv:listo). Si la conexión va lenta,
   cambia el mensaje; y por si algo falla, nunca se queda más de 25 s. */
(function(){
  var d = document, h = d.documentElement, c = d.getElementById("lv-carga"), fin = false;
  var t1 = setTimeout(function(){ c.classList.add("es-lenta"); }, 4000);
  var t2 = setTimeout(function(){ var a = d.getElementById("lv-carga-ayuda"); if (a) a.hidden = false; }, 12000);
  function quitar(){
    if (fin) return; fin = true; clearTimeout(t1); clearTimeout(t2); clearTimeout(t3);
    h.classList.add("lv-cargada"); c.removeAttribute("role");
    setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, 600);
  }
  var t3 = setTimeout(quitar, 25000);
  d.addEventListener("lv:listo", quitar);
  window.LV_quitarCarga = quitar;
})();
</script>
